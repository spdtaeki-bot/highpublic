<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: clip;
        overscroll-behavior-x: none;
        touch-action: manipulation;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
    </style>
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>정산프로그램</title>
    <meta name="description" content="일일 사무실 정산 및 파견 관리 시스템" />
    <meta property="og:title" content="정산프로그램" />
    <meta property="og:description" content="일일 사무실 정산 및 파견 관리 시스템" />
  </head>
  <body>
    <div id="root">
      <!-- 인스턴트 앱 쉘 스켈레톤: 자바스크립트 다운로드 및 구동 중에 0초 즉시 표시되어 체감 로딩 시간을 완전히 없앱니다 -->
      <div style="min-height: 100vh; background-color: #FBFBFA; color: #1c1917; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased;">
        <!-- 상단 헤더 -->
        <header style="background: #ffffff; border-bottom: 1px solid #e7e5e4; position: sticky; top: 0; z-index: 40; box-shadow: 0 1px 2px rgba(0,0,0,0.03);">
          <div style="max-width: 64rem; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="width: 36px; height: 36px; background: #1c1917; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M16 18h.01"/></svg>
              </div>
              <div>
                <div style="font-size: 16px; font-weight: 900; color: #1c1917; letter-spacing: -0.02em;">정산프로그램</div>
                <div style="display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; color: #10b981;">
                  <span style="width: 6px; height: 6px; background: #10b981; border-radius: 50%; display: inline-block;"></span>
                  실시간 연결됨
                </div>
              </div>
            </div>
            <div style="display: flex; gap: 8px;">
              <div style="width: 70px; height: 32px; background: #f5f5f4; border-radius: 8px;" class="sk-pulse"></div>
            </div>
          </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main style="max-width: 64rem; margin: 0 auto; padding: 14px 16px;">
          <!-- 탭 메뉴 스켈레톤 -->
          <div style="display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px;">
            <div style="padding: 7px 16px; background: #1c1917; color: white; border-radius: 8px; font-size: 13px; font-weight: 700; white-space: nowrap;">리스트</div>
            <div style="padding: 7px 16px; background: #f5f5f4; color: #78716c; border-radius: 8px; font-size: 13px; font-weight: 700; white-space: nowrap;">정산</div>
            <div style="padding: 7px 16px; background: #f5f5f4; color: #78716c; border-radius: 8px; font-size: 13px; font-weight: 700; white-space: nowrap;">총미수금상세</div>
            <div style="padding: 7px 16px; background: #f5f5f4; color: #78716c; border-radius: 8px; font-size: 13px; font-weight: 700; white-space: nowrap;">통계</div>
          </div>

          <!-- 통계 카드 4개 그리드 -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px;">
            <div style="background: white; border: 1px solid #e7e5e4; border-radius: 14px; padding: 14px;">
              <div style="width: 50px; height: 12px; margin-bottom: 8px;" class="sk-pulse"></div>
              <div style="width: 80px; height: 20px;" class="sk-pulse"></div>
            </div>
            <div style="background: white; border: 1px solid #e7e5e4; border-radius: 14px; padding: 14px;">
              <div style="width: 50px; height: 12px; margin-bottom: 8px;" class="sk-pulse"></div>
              <div style="width: 80px; height: 20px;" class="sk-pulse"></div>
            </div>
            <div style="background: white; border: 1px solid #e7e5e4; border-radius: 14px; padding: 14px;">
              <div style="width: 50px; height: 12px; margin-bottom: 8px;" class="sk-pulse"></div>
              <div style="width: 80px; height: 20px;" class="sk-pulse"></div>
            </div>
            <div style="background: white; border: 1px solid #e7e5e4; border-radius: 14px; padding: 14px;">
              <div style="width: 50px; height: 12px; margin-bottom: 8px;" class="sk-pulse"></div>
              <div style="width: 80px; height: 20px;" class="sk-pulse"></div>
            </div>
          </div>

          <!-- 리스트 테이블 스켈레톤 -->
          <div style="background: white; border: 1px solid #e7e5e4; border-radius: 14px; padding: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
              <div style="width: 100px; height: 16px;" class="sk-pulse"></div>
              <div style="width: 70px; height: 28px; border-radius: 6px;" class="sk-pulse"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <div style="height: 48px; border-radius: 8px;" class="sk-pulse"></div>
              <div style="height: 48px; border-radius: 8px;" class="sk-pulse"></div>
              <div style="height: 48px; border-radius: 8px;" class="sk-pulse"></div>
            </div>
          </div>
        </main>

        <style>
          @keyframes skPulse {
            0%, 100% { opacity: 0.6; background-color: #f5f5f4; }
            50% { opacity: 0.95; background-color: #e7e5e4; }
          }
          .sk-pulse {
            animation: skPulse 1.4s ease-in-out infinite;
            border-radius: 6px;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
