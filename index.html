<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden !important;
        overscroll-behavior-x: none;
        touch-action: manipulation;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
    </style>
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>정산프로그램</title>
  </head>
  <body>
    <div id="root">
      <!-- 자바스크립트가 로드되기 전에 보여줄 로딩 화면 -->
      <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f5f5f0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; z-index: 9999;">
        <div style="width: 40px; height: 40px; border: 3px solid #e5e5e0; border-top: 3px solid #1a1a1a; border-radius: 50%; animate: spin 1s linear infinite;"></div>
        <p style="margin-top: 20px; color: #1a1a1a; font-weight: 600; font-size: 14px;">프로그램을 불러오는 중입니다...</p>
        <p style="margin-top: 8px; color: #888; font-size: 11px;">잠시만 기다려 주세요 (서버 깨우는 중)</p>
        <style>
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
